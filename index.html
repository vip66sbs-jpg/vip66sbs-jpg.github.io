<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="دليل الطالب في الكفايات اللغوية للمرحلة الثانوية"><title>دليل الطالب في الكفايات اللغوية</title><style>:root{font-family:Tahoma,Arial,sans-serif;color:#15253c;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#12345a;color:white;padding:22px 18px}header h1{font-size:clamp(22px,4vw,35px);margin:0 0 8px}header p{margin:0;color:#d9e7f7}.layout{display:flex;min-height:calc(100vh - 115px)}aside{width:245px;background:white;padding:18px;border-left:1px solid #e3e8ef}aside button{display:block;width:100%;border:0;background:transparent;text-align:right;padding:14px;border-radius:12px;font-size:16px;cursor:pointer}aside button:hover,aside button.active{background:#e9f2ff}main{flex:1;min-width:0;padding:25px;max-width:1150px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card{background:white;border:1px solid #e3e8ef;border-radius:16px;padding:22px;cursor:pointer;text-align:right;box-shadow:0 3px 12px #15253c09}.card strong{display:block;font-size:19px;margin:10px 0}.card small{color:#596779}.emoji{font-size:34px}.panel{background:white;border-radius:16px;padding:20px;margin:15px 0;border:1px solid #e3e8ef}button.action{border:0;border-radius:9px;padding:11px 17px;background:#174b83;color:white;cursor:pointer}button.option{display:block;width:100%;text-align:right;margin:9px 0;padding:12px;background:#f7f9fc;border:1px solid #cdd8e5;border-radius:9px;cursor:pointer}.option.selected{border-color:#174b83;background:#e9f2ff}.muted{color:#66758a}.back{margin-bottom:15px}.mind{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.mind span{background:#e8f1fc;border-radius:10px;padding:12px}.mind b{background:#12345a;color:white;padding:12px;border-radius:10px}a{color:#145da0}@media(max-width:700px){.layout{display:block}aside{width:100%;border:0;padding:10px;display:flex;overflow-x:auto;gap:6px}aside button{min-width:145px;white-space:nowrap;font-size:14px}main{padding:15px}} </style></head><body><header><h1>دليل الطالب في الكفايات اللغوية للمرحلة الثانوية</h1><p>سراج المعرفة | شرح مختصر • خرائط ذهنية • تدريبات فورية</p></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div><script>
const data=[{name:'الكفاية النحوية',emoji:'🔵',lessons:['النشاطات التمهيدية والاختبار القبلي','الجملة الأساسية وأقسام الكلمة','إعراب الفعل المضارع','كان وأخواتها وإن وأخواتها','نائب الفاعل']},{name:'الكفاية الإملائية',emoji:'🟢',lessons:['النشاطات التمهيدية والاختبار القبلي','علامات الترقيم','أعراف الكتابة']},{name:'الكفاية القرائية',emoji:'🟡',lessons:['النشاطات التمهيدية والاختبار القبلي','القراءة السريعة','القراءة المركزة للاستذكار']},{name:'الكفاية الكتابية',emoji:'🟣',lessons:['النشاطات التمهيدية والاختبار القبلي','تصميم مخطط الموضوع','مهارات بناء الموضوع']},{name:'كفاية التواصل الشفهي (الاستماع)',emoji:'🟠',lessons:['النشاطات التمهيدية والاختبار القبلي','مهارات الاستماع الفعال','استراتيجيات الإلقاء والتحدث','مهارات الحوار والتواصل']}];
const app=document.getElementById('app'),nav=document.getElementById('nav');let current=-1,chosen=-1;function menu(){nav.innerHTML='<button onclick="home()">🏠 الرئيسية</button>'+data.map((s,i)=>`<button class="${current===i?'active':''}" onclick="section(${i})">${s.emoji} ${s.name}</button>`).join('')}function home(){current=-1;menu();app.innerHTML='<h2>اختر الكفاية لبدء التعلم</h2><p class="muted">خمسة مسارات تعليمية مرتبة لتسهيل الوصول إلى الدروس.</p><div class="cards">'+data.map((s,i)=>`<button class="card" onclick="section(${i})"><span class="emoji">${s.emoji}</span><strong>${s.name}</strong><small>${s.lessons.length} موضوعات في الفهرس الأولي ←</small></button>`).join('')+'</div><div class="panel"><strong>تنبيه المحتوى</strong><p>الفهرس الحالي أولي ويحتاج مطابقة مع فهرس الكتاب الرسمي. الفيديوهات غير مضافة حتى التحقق من مصادرها.</p></div>'}function section(i){current=i;menu();let s=data[i];app.innerHTML=`<button class="action back" onclick="home()">العودة للرئيسية</button><h2>${s.emoji} ${s.name}</h2><p class="muted">اختر درسًا لعرض الفيديو والخريطة والملخص والاختبار.</p><div class="cards">`+s.lessons.map((l,j)=>`<button class="card" onclick="lesson(${i},${j})"><strong>${j+1}. ${l}</strong><small>فتح الدرس ←</small></button>`).join('')+'</div>'}function lesson(i,j){current=i;menu();const l=data[i].lessons[j];const demo=i===0&&j===1;app.innerHTML=`<button class="action back" onclick="section(${i})">العودة للدروس</button><h2>${l}</h2><div class="panel"><h3>🎬 فيديو الشرح</h3><p class="muted">قيد اختيار فيديو موثوق مناسب لهذا الدرس من عين أو يوتيوب.</p></div><div class="panel"><h3>🗺️ الخريطة الذهنية</h3>${demo?'<div class="mind"><b>الجملة</b><span>اسمية ← تبدأ باسم</span><span>فعلية ← تبدأ بفعل</span></div>':'<p class="muted">ستضاف الخريطة بعد مراجعة المحتوى العلمي.</p>'}</div><div class="panel"><h3>📝 الملخص المركز</h3>${demo?'<p>الجملة الاسمية تبدأ باسم، وتتكون غالبًا من مبتدأ وخبر. والجملة الفعلية تبدأ بفعل، وتتكون غالبًا من فعل وفاعل، وقد تتضمن مفعولًا به.</p><p><b>مثال:</b> العلمُ نافعٌ (اسمية). كتبَ الطالبُ الدرسَ (فعلية).</p>':'<p class="muted">الملخص قيد الإعداد والمراجعة.</p>'}</div><div class="panel"><h3>⚡ الاختبار الفوري</h3>${demo?'<p><b>ما نوع الجملة: «قرأَ الطالبُ الكتابَ»؟</b></p><div id="answers"></div><button class="action" onclick="grade()">تصحيح الإجابة</button><p id="result" aria-live="polite"></p>':'<p class="muted">ستضاف الأسئلة بعد تجهيز محتوى الدرس.</p>'}</div>`;if(demo){chosen=-1;document.getElementById('answers').innerHTML=['جملة اسمية','جملة فعلية','شبه جملة','أسلوب نداء'].map((a,k)=>`<button class="option" onclick="pick(${k})" id="opt${k}">${'أبجد'[k]}. ${a}</button>`).join('')}}function pick(k){chosen=k;document.querySelectorAll('.option').forEach((b,i)=>b.classList.toggle('selected',i===k))}function grade(){document.getElementById('result').textContent=chosen<0?'اختر إجابة أولًا.':chosen===1?'إجابة صحيحة ✓ لأن الجملة بدأت بالفعل «قرأَ».':'إجابة غير صحيحة. الجواب: ب، جملة فعلية لأنها بدأت بفعل.'}home();</script></body></html>
